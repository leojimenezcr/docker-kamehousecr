name: ollama

# Servidor de modelos LLM locales (Ollama). Sin puerto de host ni proxy: lo
# consume unicamente el AI Assistant del stack `n8n` via la red
# `ollama-net`, nunca se expone a internet.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - TZ=America/Costa_Rica
    volumes:
      - ${BASE_DIR}/models:/root/.ollama
    networks:
      - ollama-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

networks:
  ollama-net:
    attachable: true
